# Optional: Spiel als Webseite über GitHub Pages veröffentlichen (manuell starten).
# Voraussetzung: Settings -> Pages -> Source: "GitHub Actions"
name: Pages
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js && mkdir site && cp dist/FCK.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
